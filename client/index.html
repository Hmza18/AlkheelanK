<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var saved = localStorage.getItem("kheelan.theme") || localStorage.getItem("alkheelank-theme");
        if (saved === "dark" || saved === "classic") {
          document.documentElement.setAttribute("data-theme", "dark");
        } else if (saved === "light" || saved === "blue") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    </script>
