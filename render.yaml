# One-click Render blueprint for the AlkheelanK server.
# In the Render dashboard: New → Blueprint → point at this repo.
services:
  - type: web
    name: alkheelank-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: CORS_ORIGIN
        sync: false # set this to your Vercel URL after the client is deployed
