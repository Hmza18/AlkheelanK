# One-click Render blueprint for the Alkheeloot server.
# In the Render dashboard: New → Blueprint → point at this repo.
services:
  - type: web
    name: alkheelank-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: CORS_ORIGIN
        value: https://www.alkheeloot.xyz,https://alkheeloot.xyz
