# One-click Render blueprint for the Alkheeloot server.
# In the Render dashboard: New → Blueprint → point at this repo.
services:
  - type: web
    name: alkheelank-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: CORS_ORIGIN
        value: https://www.alkheelan.xyz,https://alkheelan.xyz,https://alkheelan-k.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: STARTER_IMAGES_BASE_URL
        sync: false
